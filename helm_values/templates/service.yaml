apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - port: {{ .Values.service.port }}
    protocol: TCP
    targetPort: {{ .Values.containerPort }}
    nodePort: {{ .Values.service.nodePort }}
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Chart.Name }}

